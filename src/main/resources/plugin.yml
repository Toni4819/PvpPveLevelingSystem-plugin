name: PvpPveLevelingSystem
version: ${version}
main: fr.toni_4819.pvpPveLevelingSystem.PvpPveLevelingSystem
api-version: '1.21'
depend: [PlaceholderAPI]
soft-depend: [LuckPerms]
commands:
  leveling:
    description: Manage XP/Levels for PvpPveLevelingSystem
    usage: /<command> <subcommand>
    aliases: [pvppvelevelingsystem]
    permission: pvppvelevelingsystem.admin
  levels:
    description: Open the levels and rewards menu
    usage: /<command> [page]
    permission: pvppvelevelingsystem.gui

permissions:
  pvppvelevelingsystem.admin:
    description: Access to /leveling
    default: op
  pvppvelevelingsystem.gui:
    description: Access to /levels
    default: true

